# Pinned upstream v0.30.0 / a8576ccb725c4e21cd13c3eb5f9a546b21149d2b.
# VoxCPM2 deploy: single-stage AR pipeline with per-request state batching.
# Concurrency defaults to 8; deployment values support 1...128. The engine
# entrypoint applies TTS_MAX_CONCURRENT to both sequence and graph capacities
# when set; otherwise this YAML controls them independently of the gateway.
#
# VoxCPM2-local runtime knobs are passed through hf_overrides.
async_chunk: false
dtype: bfloat16

stages:
  - stage_id: 0
    max_num_seqs: 8
    gpu_memory_utilization: 0.9
    # Explicit KV budget: increasing max_num_seqs does not resize this cache.
    # Tune against live token usage and GPU capacity. CFM/AudioVAE and graph
    # pools allocate outside vLLM's KV accounting, so this is not total VRAM.
    # A 128-sequence cap alone does not guarantee 128 resident long requests.
    kv_cache_memory_bytes: 6442450944  # 6 GiB
    enforce_eager: true
    trust_remote_code: false
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    engine_extras:
      hf_overrides:
        voxcpm2_runtime_config:
          audio_emit_every: 1
          vae_decode_every: 3
          enable_batched_cfm: true
          enable_batched_vae_decode: true
          coalesce_audio_d2h: true
          enable_loc_dit_fused_qkv: true
          enable_loc_dit_fused_mlp: true
          enable_loc_dit_zero_dt_cache: true
          enable_loc_dit_skip_qkv_contig: true
          enable_loc_dit_reduce_overhead_no_cg: true
          enable_unified_decode_graph: true
          unified_decode_graph_max_batch_size: 8  # 1...max_num_seqs (maximum 128)
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.0
