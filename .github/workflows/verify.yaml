name: Verify local node and test-token accounting
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify isolated Docker storage, restart and local chain
        run: ./scripts/verify-docker.sh
